---

- hosts: all
  become: true
  pre_tasks:

  - name: update repository index(Ubuntu)
    tags: always
    apt:
      update_cache: yes
      cache_valid_time: 36000 # did we do it in last 10 hours?
    changed_when: false
    when: ansible_distribution == "Ubuntu"

- hosts: all
  become: true
  roles:
    - base

- hosts: workstations
  become: true
  roles:
    - workstations

- hosts: web_servers
  become: true
  roles:
    - web_servers
  
- hosts: db_servers
  become: true
  roles:
    - db_servers

- hosts: file_servers
  become: true
  roles:
    - file_servers
